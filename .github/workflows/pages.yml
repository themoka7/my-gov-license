name: Deploy study page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tools/build_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.html 은 Claude Artifact 용 조각이라 <!doctype>·<head> 가 없다.
      # 정적 호스팅용으로 charset·viewport·리셋을 감싼 완전한 문서를 만든다.
      - name: Build standalone document
        run: python3 tools/build_pages.py

      - name: Verify build output
        run: |
          test -s _site/index.html
          head -c 15 _site/index.html | grep -qi '<!doctype html>'
          grep -q 'name="viewport"' _site/index.html
          echo "검증 통과 — $(du -h _site/index.html | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
